name: Archive a séance

# Copies the real outputs of a "Séance (real Gemma)" run (ofrendas,
# transcripts, eval tables) into docs/demo/ so they live in the repository.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a 'Séance (real Gemma)' workflow run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Lay the outputs in docs/demo
        env:
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p docs/demo
          if [ -d artifacts/showcase ]; then   # replace the showcase, keep the eval
            find docs/demo -mindepth 1 -maxdepth 1 ! -name eval -exec rm -rf {} +
            cp -r artifacts/showcase/. docs/demo/
          fi
          if ls -d artifacts/eval-* >/dev/null 2>&1; then
            rm -rf docs/demo/eval && mkdir -p docs/demo/eval
            for d in artifacts/eval-*; do cp "$d"/* docs/demo/eval/; done
            cat docs/demo/eval/*.md > docs/demo/eval/README.md
          fi
          printf 'Real outputs from [run %s](https://github.com/%s/actions/runs/%s), gemma3 on a free CPU-only GitHub runner.\n' \
            "$RUN_ID" "$REPO" "$RUN_ID" > docs/demo/SOURCE.md
          find docs/demo -type f | sort
      - name: Commit
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo
          if git diff --cached --quiet; then echo "Nothing new to archive."; exit 0; fi
          git commit -m "Archive real séance outputs from run $RUN_ID"
          git push
